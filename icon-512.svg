<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Fundo laranja -->
  <rect width="512" height="512" rx="100" fill="#E8560A"/>
  <!-- Quadrado azul ciano -->
  <rect x="90" y="90" width="332" height="332" rx="58" fill="#00BFFF"/>
  <!-- Gradiente sutil -->
  <rect x="90" y="90" width="332" height="332" rx="58" fill="url(#s2)" opacity="0.12"/>
  <defs>
    <linearGradient id="s2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white"/>
      <stop offset="100%" stop-color="black"/>
    </linearGradient>
  </defs>
  <!-- Letra D branca -->
  <text x="256" y="345" font-size="280" font-weight="bold" text-anchor="middle" font-family="Arial Black, Arial" fill="white">D</text>
</svg>
