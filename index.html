<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F27820">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Leiturista">
<meta name="description" content="Curso e guia de campo para leituristas Domus Soluções">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.svg">
<title>Leiturista · Domus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   IDENTIDADE DOMUS (cores tiradas da apresentação institucional)
   ===================================================================== */
:root {
  --orange: #F27820;
  --orange-dark: #C95E10;
  --orange-faint: #FFF1E6;
  --navy: #1A3A5C;
  --blue: #2C5F8A;
  --sky: #A8D4F5;
  --sky-faint: #DEEEF8;
  --ink: #1A1A1A;
  --text: #333333;
  --muted: #666666;
  --bg: #F3F6F8;
  --card: #FFFFFF;
  --border: #DCE5EC;
  --green: #1E7A45;  --green-bg: #E8F5EE;
  --red: #B3261E;    --red-bg: #FCEEEC;
  --yellow: #8A5A00; --yellow-bg: #FFF6DF;
  --info: #2C5F8A;   --info-bg: #E6F0F8;
  --radius: 14px;
  --radius-sm: 9px;
  --shadow: 0 2px 10px rgba(26,58,92,0.08);
  --font: 'DM Sans', system-ui, sans-serif;
  --display: 'Archivo', 'Arial Black', system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; font-family: var(--font); background: var(--bg); color: var(--text); overflow: hidden; overscroll-behavior: none; }
button { font-family: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

#app { display: flex; flex-direction: column; height: 100dvh; max-width: 520px; margin: 0 auto; background: var(--bg); position: relative; }

/* ---------- Topbar ---------- */
#topbar { background: var(--navy); padding-top: env(safe-area-inset-top, 0); flex-shrink: 0; z-index: 5; }
#topbar-inner { display: flex; align-items: center; gap: 10px; padding: 12px 16px; min-height: 58px; }
#btn-back { display: none; width: 40px; height: 40px; border-radius: 10px; border: none; background: rgba(255,255,255,0.14); color: #fff; font-size: 20px; cursor: pointer; flex-shrink: 0; align-items: center; justify-content: center; }
#btn-back.show { display: flex; }
#topbar-title { flex: 1; color: #fff; font-family: var(--display); font-weight: 800; font-size: 17px; letter-spacing: 0.2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#topbar-brand { font-family: var(--display); font-weight: 900; font-size: 13px; color: #fff; letter-spacing: 1px; }
#topbar-brand span { color: var(--orange); }

/* ---------- Content ---------- */
#content { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
.view { padding: 16px 16px 28px; }
.view.flush { padding: 0 0 28px; }

/* ---------- Bottom nav ---------- */
#bottomnav { display: flex; background: var(--card); border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom, 0); flex-shrink: 0; z-index: 5; }
.nav-btn { flex: 1; border: none; background: none; padding: 9px 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; position: relative; min-height: 56px; }
.nav-btn .ic { font-size: 21px; line-height: 1; }
.nav-btn .lb { font-size: 11px; font-weight: 600; color: var(--muted); }
.nav-btn.active .lb { color: var(--orange-dark); }
.nav-btn.active::before { content: ''; position: absolute; top: 0; left: 24%; right: 24%; height: 3px; border-radius: 0 0 3px 3px; background: var(--orange); }

/* ---------- Tipografia ---------- */
.eyebrow { font-family: var(--display); font-size: 12px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase; color: var(--blue); margin: 22px 0 10px; }
.eyebrow:first-child { margin-top: 4px; }
h2.big { font-family: var(--display); font-weight: 900; font-size: 26px; line-height: 1.1; color: var(--ink); }
.lead { font-size: 15px; line-height: 1.55; color: var(--text); }

/* ---------- Hero ---------- */
.hero { background: var(--navy); border-radius: var(--radius); padding: 22px 20px 20px; color: #fff; position: relative; overflow: hidden; border-left: 6px solid var(--orange); }
.hero h2 { font-family: var(--display); font-weight: 900; font-size: 26px; line-height: 1.1; text-transform: uppercase; }
.hero h2 em { font-style: normal; color: var(--orange); }
.hero p { font-size: 14px; color: rgba(255,255,255,0.85); margin-top: 8px; line-height: 1.5; }
.hero-progress { margin-top: 16px; background: rgba(255,255,255,0.1); border-radius: 10px; padding: 12px; display: flex; align-items: center; gap: 12px; cursor: pointer; border: none; width: 100%; text-align: left; color: #fff; }
.hero-progress .pct { font-family: var(--display); font-weight: 900; font-size: 22px; color: var(--orange); min-width: 56px; }
.hero-progress .txt { flex: 1; font-size: 13px; line-height: 1.35; }
.hero-progress .txt b { display: block; font-size: 14px; }
.bar { height: 8px; background: var(--sky-faint); border-radius: 8px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--orange); border-radius: 8px; transition: width .4s; }
.hero .bar { background: rgba(255,255,255,0.18); margin-top: 6px; }

/* ---------- Grade de serviços ---------- */
.svc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.svc { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 12px 12px; text-align: left; cursor: pointer; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 6px; min-height: 120px; position: relative; border-top: 4px solid var(--orange); transition: transform .1s; }
.svc:active { transform: scale(0.97); }
.svc .ic { font-size: 28px; line-height: 1; }
.svc .t { font-family: var(--display); font-weight: 800; font-size: 15px; line-height: 1.15; color: var(--ink); }
.svc .s { font-size: 12px; color: var(--muted); line-height: 1.3; }
.svc .badge { position: absolute; top: 10px; right: 10px; }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; border-radius: 20px; padding: 3px 8px; }
.badge.done { background: var(--green-bg); color: var(--green); }
.badge.soon { background: var(--yellow-bg); color: var(--yellow); }
.badge.video { background: var(--sky-faint); color: var(--navy); }

/* ---------- Listas / cartões ---------- */
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
.list { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; align-items: center; gap: 12px; padding: 13px 14px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); cursor: pointer; text-align: left; width: 100%; box-shadow: var(--shadow); }
.row:active { background: var(--sky-faint); }
.row .ri { width: 42px; height: 42px; border-radius: 11px; background: var(--orange-faint); display: flex; align-items: center; justify-content: center; font-size: 21px; flex-shrink: 0; }
.row .rt { flex: 1; min-width: 0; }
.row .rt b { display: block; font-size: 15px; color: var(--ink); line-height: 1.25; }
.row .rt small { display: block; font-size: 12.5px; color: var(--muted); margin-top: 2px; line-height: 1.3; }
.row .chev { color: var(--muted); font-size: 22px; }
.row .num { font-family: var(--display); font-weight: 900; font-size: 13px; color: var(--blue); width: 22px; text-align: center; flex-shrink: 0; }
.row.locked { opacity: .65; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--border); background: var(--card); border-radius: 22px; padding: 9px 13px; font-size: 13.5px; font-weight: 600; color: var(--navy); cursor: pointer; text-align: left; }
.chip:active { background: var(--sky-faint); }

/* ---------- Alertas ---------- */
.alert { border-radius: var(--radius-sm); padding: 12px 14px; border-left: 4px solid; margin-bottom: 10px; font-size: 14px; line-height: 1.5; }
.alert .at { font-weight: 700; margin-bottom: 3px; }
.alert li { margin-left: 18px; }
.alert.red { background: var(--red-bg); border-color: var(--red); color: #5c1410; }
.alert.yellow { background: var(--yellow-bg); border-color: #E0A100; color: #4d3500; }
.alert.green { background: var(--green-bg); border-color: var(--green); color: #0f3d23; }
.alert.blue { background: var(--info-bg); border-color: var(--blue); color: var(--navy); }

/* ---------- Cabeçalho da trilha ---------- */
.trail-head { background: var(--navy); color: #fff; padding: 18px 16px 0; }
.trail-head .ic { font-size: 34px; }
.trail-head h2 { font-family: var(--display); font-weight: 900; font-size: 23px; line-height: 1.1; margin-top: 6px; text-transform: uppercase; }
.trail-head p { font-size: 14px; color: rgba(255,255,255,0.85); margin-top: 6px; line-height: 1.45; }
.tabs { display: flex; gap: 6px; overflow-x: auto; padding: 14px 0 0; scrollbar-width: none; margin: 0 -16px; padding-left: 16px; padding-right: 16px; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex-shrink: 0; border: none; background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.85); padding: 10px 13px; border-radius: 10px 10px 0 0; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; }
.tab.active { background: var(--bg); color: var(--navy); }
.tab .ok { color: #7EE2A8; margin-left: 3px; }
.tab.active .ok { color: var(--green); }
.trail-body { padding: 16px; }
.step-nav { display: flex; gap: 10px; margin-top: 20px; }
.btn { flex: 1; border: none; border-radius: 11px; padding: 14px 16px; font-size: 15px; font-weight: 700; cursor: pointer; min-height: 50px; }
.btn.primary { background: var(--orange); color: #fff; }
.btn.primary:active { background: var(--orange-dark); }
.btn.ghost { background: var(--card); color: var(--navy); border: 1px solid var(--border); }
.btn.navy { background: var(--navy); color: #fff; }
.btn:disabled { opacity: .5; }

/* ---------- Vídeo ---------- */
.video-box { border-radius: var(--radius); overflow: hidden; background: #000; aspect-ratio: 9 / 16; max-height: 70vh; margin: 0 auto; width: 100%; }
.video-box.wide { aspect-ratio: 16 / 9; }
.video-box iframe, .video-box video { width: 100%; height: 100%; border: 0; display: block; }
.video-empty { border-radius: var(--radius); background: var(--navy); color: #fff; padding: 30px 20px; text-align: center; aspect-ratio: 16 / 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; position: relative; overflow: hidden; }
.video-empty::after { content: ''; position: absolute; inset: auto -40px -60px auto; width: 180px; height: 180px; border-radius: 50%; background: rgba(242,120,32,0.18); }
.video-empty .play { width: 64px; height: 64px; border-radius: 50%; background: var(--orange); display: flex; align-items: center; justify-content: center; font-size: 26px; padding-left: 4px; }
.video-empty b { font-family: var(--display); font-weight: 800; font-size: 17px; }
.video-empty span { font-size: 13.5px; color: rgba(255,255,255,0.8); line-height: 1.45; max-width: 300px; }
.offline-note { font-size: 12.5px; color: var(--muted); margin-top: 8px; text-align: center; }

/* ---------- Passo a passo ---------- */
.phase { font-family: var(--display); font-weight: 800; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--orange-dark); margin: 18px 0 10px; display: flex; align-items: center; gap: 8px; }
.phase:first-child { margin-top: 0; }
.phase::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.steps { display: flex; flex-direction: column; gap: 8px; }
.step { display: flex; gap: 12px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px; }
.step .n { width: 28px; height: 28px; border-radius: 50%; background: var(--navy); color: #fff; font-family: var(--display); font-weight: 800; font-size: 13px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.step .tx { font-size: 14.5px; line-height: 1.5; color: var(--ink); flex: 1; }
.step .tx small { display: block; color: var(--muted); font-size: 13px; margin-top: 3px; }
.step img { width: 100%; border-radius: 8px; margin-top: 8px; display: block; }
.step.key { border-color: var(--orange); background: var(--orange-faint); }
.step.key .n { background: var(--orange); }

/* ---------- Assistente de baixa ---------- */
.wizard { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 16px; box-shadow: var(--shadow); }
.wz-trail { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.wz-trail span { font-size: 12px; background: var(--sky-faint); color: var(--navy); border-radius: 14px; padding: 4px 9px; }
.wz-q { font-family: var(--display); font-weight: 800; font-size: 19px; line-height: 1.25; color: var(--ink); }
.wz-help { font-size: 13.5px; color: var(--muted); margin-top: 6px; line-height: 1.45; }
.wz-opts { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
.wz-opt { border: 2px solid var(--border); background: var(--card); border-radius: 11px; padding: 14px; font-size: 15px; font-weight: 700; text-align: left; cursor: pointer; color: var(--navy); min-height: 52px; }
.wz-opt:active { border-color: var(--orange); background: var(--orange-faint); }
.wz-result .rt { font-family: var(--display); font-weight: 900; font-size: 19px; line-height: 1.2; margin-bottom: 10px; }
.wz-result ul { list-style: none; display: flex; flex-direction: column; gap: 8px; }
.wz-result li { font-size: 14.5px; line-height: 1.45; padding-left: 26px; position: relative; }
.wz-result li::before { content: '✓'; position: absolute; left: 0; top: 0; width: 19px; height: 19px; border-radius: 50%; background: currentColor; color: #fff; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
.wz-result li.warn::before { content: '!'; }
.wz-result.green { color: var(--green); } .wz-result.green li { color: var(--ink); } .wz-result.green li::before { background: var(--green); }
.wz-result.red { color: var(--red); } .wz-result.red li { color: var(--ink); } .wz-result.red li::before { background: var(--red); }
.wz-result.yellow { color: var(--yellow); } .wz-result.yellow li { color: var(--ink); } .wz-result.yellow li::before { background: #D99A00; }
.draft-note { font-size: 12.5px; color: var(--yellow); background: var(--yellow-bg); border-radius: 8px; padding: 9px 11px; margin-top: 14px; line-height: 1.45; }

/* ---------- Erros comuns ---------- */
.err { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; margin-bottom: 10px; }
.err .w, .err .r { padding: 11px 13px 11px 40px; font-size: 14.5px; line-height: 1.45; position: relative; }
.err .w { background: var(--red-bg); color: #5c1410; }
.err .r { color: var(--ink); }
.err .w::before, .err .r::before { position: absolute; left: 12px; top: 10px; font-weight: 900; font-size: 15px; }
.err .w::before { content: '✗'; color: var(--red); }
.err .r::before { content: '✓'; color: var(--green); }

/* ---------- Checklist ---------- */
.cl-item { display: flex; gap: 12px; align-items: flex-start; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 13px; margin-bottom: 8px; cursor: pointer; text-align: left; width: 100%; }
.cl-item .box { width: 26px; height: 26px; border-radius: 7px; border: 2px solid var(--border); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-weight: 900; color: #fff; font-size: 15px; }
.cl-item.on { background: var(--green-bg); border-color: #b9e2c9; }
.cl-item.on .box { background: var(--green); border-color: var(--green); }
.cl-item .tx { font-size: 14.5px; line-height: 1.45; color: var(--ink); }
.cl-item .tx small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 3px; }
.cl-item.on .tx > span { text-decoration: line-through; color: var(--muted); }
.cl-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; font-size: 13.5px; font-weight: 700; color: var(--navy); }

/* ---------- Quiz ---------- */
.q-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 16px; }
.q-count { font-size: 12.5px; font-weight: 700; color: var(--blue); text-transform: uppercase; letter-spacing: 1px; }
.q-text { font-family: var(--display); font-weight: 800; font-size: 18px; line-height: 1.3; color: var(--ink); margin: 8px 0 14px; }
.q-opt { display: block; width: 100%; text-align: left; border: 2px solid var(--border); background: var(--card); border-radius: 11px; padding: 13px 14px; margin-bottom: 8px; font-size: 14.5px; font-weight: 600; cursor: pointer; line-height: 1.4; color: var(--ink); }
.q-opt.right { border-color: var(--green); background: var(--green-bg); }
.q-opt.wrong { border-color: var(--red); background: var(--red-bg); }
.q-why { font-size: 14px; line-height: 1.5; padding: 11px 13px; border-radius: 9px; margin-top: 6px; }
.q-why.ok { background: var(--green-bg); color: #0f3d23; }
.q-why.no { background: var(--red-bg); color: #5c1410; }
.score { text-align: center; padding: 26px 16px; }
.score .big { font-family: var(--display); font-weight: 900; font-size: 46px; color: var(--orange); }

/* ---------- Lição (texto) ---------- */
.lesson h3 { font-family: var(--display); font-weight: 800; font-size: 16px; color: var(--navy); margin: 18px 0 8px; }
.lesson h3:first-child { margin-top: 0; }
.lesson p { font-size: 15px; line-height: 1.6; margin-bottom: 8px; }
.lesson ul.dots { list-style: none; display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
.lesson ul.dots li { padding-left: 18px; position: relative; font-size: 14.5px; line-height: 1.5; }
.lesson ul.dots li::before { content: ''; position: absolute; left: 3px; top: 8px; width: 7px; height: 7px; border-radius: 50%; background: var(--orange); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.tags span { background: var(--sky-faint); color: var(--navy); border-radius: 16px; padding: 5px 11px; font-size: 13px; font-weight: 600; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
.two div { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 11px; font-size: 13px; line-height: 1.4; }
.two b { display: block; font-size: 14px; color: var(--ink); margin: 4px 0 2px; }

/* ---------- Busca ---------- */
.search { display: flex; align-items: center; gap: 8px; background: var(--card); border: 2px solid var(--border); border-radius: 12px; padding: 0 12px; }
.search:focus-within { border-color: var(--orange); }
.search input { flex: 1; border: none; outline: none; font-size: 16px; padding: 13px 0; font-family: inherit; background: transparent; color: var(--ink); min-width: 0; }
.faq-a { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
.faq-a h3 { font-family: var(--display); font-weight: 800; font-size: 18px; color: var(--ink); margin-bottom: 10px; line-height: 1.25; }
.empty { text-align: center; color: var(--muted); padding: 30px 10px; font-size: 14px; line-height: 1.5; }
.empty .e { font-size: 34px; display: block; margin-bottom: 8px; }

/* ---------- Onboarding ---------- */
#onboarding { position: fixed; inset: 0; z-index: 50; background: var(--navy); display: flex; flex-direction: column; justify-content: center; padding: 28px 22px; color: #fff; }
#onboarding.hidden { display: none; }
#onboarding .logo { font-family: var(--display); font-weight: 900; font-size: 40px; line-height: 1; }
#onboarding .logo span { display: block; color: var(--orange); font-size: 22px; letter-spacing: 1px; margin-top: 2px; }
#onboarding p { color: rgba(255,255,255,0.85); font-size: 15px; line-height: 1.5; margin: 16px 0 24px; }
#onboarding label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; color: var(--sky); }
#onboarding input { width: 100%; border: 2px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08); color: #fff; border-radius: 11px; padding: 13px 14px; font-size: 16px; font-family: inherit; margin-bottom: 14px; outline: none; }
#onboarding input:focus { border-color: var(--orange); }
#onboarding input::placeholder { color: rgba(255,255,255,0.45); }
#onb-err { color: #FFB4A8; font-size: 13.5px; margin-bottom: 10px; display: none; }

#offline-badge { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(70px + env(safe-area-inset-bottom, 0)); background: var(--ink); color: #fff; font-size: 12.5px; padding: 7px 13px; border-radius: 20px; z-index: 20; display: none; }
#offline-badge.show { display: block; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); top: calc(70px + env(safe-area-inset-top, 0)); background: var(--green); color: #fff; font-weight: 700; font-size: 14px; padding: 10px 16px; border-radius: 22px; z-index: 30; display: none; box-shadow: 0 4px 16px rgba(0,0,0,.2); max-width: 90vw; text-align: center; }
#toast.show { display: block; }
</style>
</head>
<body>

<!-- ============ ONBOARDING ============ -->
<div id="onboarding" class="hidden">
  <div class="logo">DOMUS<span>LEITURISTA</span></div>
  <p>Curso e guia de campo para leituristas.<br>Antes de começar, diga quem é você.</p>
  <label for="onb-nome">Seu nome</label>

const courseSvcs = () => SERVICES.filter(s => s.curso && s.status === 'pronto');
const fundamentosDone = () => LESSONS.every(l => progress.lessons[l.id]);
const svcDone = s => !!(progress.quiz[s.id] && progress.quiz[s.id].passed);
function courseStats() {
  const items = 1 + courseSvcs().length;
  const done = (fundamentosDone() ? 1 : 0) + courseSvcs().filter(svcDone).length;
  return { items, done, pct: Math.round(done / items * 100) };
}

/* =====================================================================
   NAVEGAÇÃO (com suporte ao botão voltar do Android)
   ===================================================================== */
let stack = [];
let wizardState = {};
let quizState = {};

function render() {
  const r = stack[stack.length - 1];
  const v = document.getElementById('view');
  document.getElementById('btn-back').classList.toggle('show', stack.length > 1);
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === stack[0].name));
  const fn = VIEWS[r.name];
  const out = fn(r);
  document.getElementById('topbar-title').textContent = out.title;
  v.className = out.flush ? 'view flush' : 'view';
  v.innerHTML = out.html;
  if (out.after) out.after();
}
function go(name, params = {}, replace = false) {
  const r = { name, ...params };
  if (replace) stack[stack.length - 1] = r; else { stack.push(r); history.pushState({ d: stack.length }, ''); }
  render();
  document.getElementById('content').scrollTop = 0;
}
function goTab(name) {
  const extra = stack.length - 1;
  stack = [{ name }];
  if (extra > 0) history.go(-extra); // limpa o histórico interno
  setTimeout(() => { render(); document.getElementById('content').scrollTop = 0; }, extra > 0 ? 30 : 0);
}
window.addEventListener('popstate', () => {
  if (stack.length > 1) { stack.pop(); render(); document.getElementById('content').scrollTop = 0; }
});
function setTab(tab) {
  const r = stack[stack.length - 1];
  r.tab = tab;
  render();
  document.getElementById('content').scrollTop = 0;
}

      ${soon ? '<span class="badge soon">Em breve</span>' : (svcDone(s) ? '<span class="badge done">✓</span>' : '<span class="chev">›</span>')}</button>`;
  }).join('');
  const finished = st.done === st.items;
  return { title: 'Curso do Leiturista', html: `
    <div class="card" style="padding:16px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px">
        <b style="font-family:var(--display);font-weight:900;font-size:20px;color:var(--ink)">Seu progresso</b>
        <b style="font-family:var(--display);font-weight:900;font-size:22px;color:var(--orange)">${st.pct}%</b>
      </div>
      <div class="bar"><i style="width:${st.pct}%"></i></div>
      <p style="font-size:13.5px;color:var(--muted);margin-top:8px">${finished ? '🎉 Parabéns! Você concluiu todas as etapas disponíveis.' : 'Faça na ordem. Cada serviço termina com um teste rápido.'}</p>
    </div>
    <p class="eyebrow">Etapas</p>
    <div class="list">${fund}${rows}</div>
  ` };
};

VIEWS.fundamentos = () => ({
  title: 'Antes de ir a campo', html: `
    <p class="lead" style="margin-bottom:14px">O básico que todo leiturista precisa saber antes do primeiro serviço.</p>
    <div class="list">${LESSONS.map((l, i) => `
      <button class="row" onclick="go('lesson',{id:'${l.id}'})">
        <span class="num">${i + 1}</span><span class="ri">${l.icon}</span>
        <span class="rt"><b>${l.title}</b><small>${l.sub}</small></span>
        ${progress.lessons[l.id] ? '<span class="badge done">✓</span>' : '<span class="chev">›</span>'}
      </button>`).join('')}</div>`
});

function renderSections(sections) {
  return sections.map(s => {
    if (s.type === 'h') return `<h3>${s.text}</h3>`;
    if (s.type === 'p') return `<p>${s.text}</p>`;
    if (s.type === 'dots') return `<ul class="dots">${s.items.map(i => `<li>${i}</li>`).join('')}</ul>`;
    if (s.type === 'steps') return `<div class="steps" style="margin-bottom:10px">${s.items.map((i, k) => `<div class="step"><span class="n">${k + 1}</span><span class="tx">${i}</span></div>`).join('')}</div>`;
    if (s.type === 'alert') return alertHtml(s);
    return '';
  }).join('');
}
function alertHtml(a) {
  const body = a.items ? `<ul>${a.items.map(i => `<li>${i}</li>`).join('')}</ul>` : a.text;
  return `<div class="alert ${a.style}"><div class="at">${a.title}</div>${body}</div>`;
}

VIEWS.lesson = r => {
  const idx = LESSONS.findIndex(l => l.id === r.id);
  const l = LESSONS[idx];
  const next = LESSONS[idx + 1];
  const read = !!progress.lessons[l.id];
  return { title: l.title, html: `
    <div style="font-size:34px">${l.icon}</div>
    <h2 class="big" style="margin:6px 0 16px">${l.title}</h2>
    <div class="lesson">${renderSections(l.sections)}</div>
    <div class="step-nav">
      ${read ? `<button class="btn ghost" disabled>✓ Lida</button>` : `<button class="btn ghost" onclick="markLesson('${l.id}')">Marcar como lida</button>`}
      ${next ? `<button class="btn primary" onclick="markLesson('${l.id}',true);go('lesson',{id:'${next.id}'},true)">Próxima →</button>`
             : `<button class="btn primary" onclick="markLesson('${l.id}',true);history.back()">Concluir ✓</button>`}
    </div>` };
};
function markLesson(id, silent) {
  progress.lessons[id] = true; saveProgress();
  if (fundamentosDone() && !progress.seen.fund) { progress.seen.fund = true; saveProgress(); toast('🎉 Módulo "Antes de ir a campo" concluído!'); }
  else if (!silent) toast('✓ Lição marcada como lida');
  if (!silent) render();
}

/* ---------- Trilha de serviço ---------- */
function svcTabs(s) {
  const t = [['video', '🎬 Vídeo'], ['passos', '👣 Passo a passo']];
  if (s.baixa) t.push(['baixa', '📲 Como baixar']);
  if (s.erros && s.erros.length) t.push(['erros', '⚠️ Erros comuns']);
  if (s.checklist) t.push(['checklist', '✅ Checklist']);
  if (s.quiz) t.push(['teste', '📝 Teste']);
  return t;
}

VIEWS.svc = r => {
  const s = svcById(r.id);
  if (s.status === 'preparacao') {
    return { title: s.title, flush: true, html: `
      <div class="trail-head" style="padding-bottom:18px"><span class="ic">${s.icon}</span><h2>${s.title}</h2></div>
      <div class="trail-body"><div class="empty"><span class="e">🛠️</span>${s.intro}</div></div>` };
  }
  const tabs = svcTabs(s);
  const tab = r.tab || 'video';
  const i = tabs.findIndex(t => t[0] === tab);
  const next = tabs[i + 1];
  const prev = tabs[i - 1];
  const body = TAB[tab](s);
  const nav = `<div class="step-nav">
      ${prev ? `<button class="btn ghost" onclick="setTab('${prev[0]}')">← ${prev[1].split(' ').slice(1).join(' ')}</button>` : ''}
      ${next ? `<button class="btn primary" onclick="setTab('${next[0]}')">${next[1].split(' ').slice(1).join(' ')} →</button>` : ''}
    </div>`;
  return { title: s.title, flush: true, html: `
    <div class="trail-head">
      <span class="ic">${s.icon}</span><h2>${s.title}</h2><p>${s.sub}</p>
      <div class="tabs" role="tablist">${tabs.map(t => `<button class="tab ${t[0] === tab ? 'active' : ''}" role="tab" onclick="setTab('${t[0]}')">${t[1]}${t[0] === 'teste' && svcDone(s) ? '<span class="ok">✓</span>' : ''}</button>`).join('')}</div>
    </div>
    <div class="trail-body">${body}${tab === 'teste' ? '' : nav}</div>`,
    after: () => { const a = document.querySelector('.tab.active'); if (a) a.scrollIntoView({ inline: 'center', block: 'nearest' }); } };
};

function videoHtml(id) {
  const url = (VIDEOS[id] || '').trim();
  if (!url) return `<div class="video-empty"><span class="play">▶</span><b>Vídeo em produção</b>
    <span>Em breve você vai ver aqui a nossa equipe fazendo este serviço em campo, passo a passo.</span></div>`;
  const yt = url.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);
  if (yt) {
    const vertical = /shorts\//.test(url);
    return `<div class="video-box ${vertical ? '' : 'wide'}"><iframe src="https://www.youtube-nocookie.com/embed/${yt[1]}?rel=0&modestbranding=1&playsinline=1" title="Vídeo do procedimento" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen loading="lazy"></iframe></div>
      <p class="offline-note">O vídeo precisa de internet. O resto do guia funciona offline.</p>`;
  }
  return `<div class="video-box"><video src="${esc(url)}" controls playsinline preload="metadata"></video></div>`;
}

const TAB = {};
TAB.video = s => `${videoHtml(s.id)}
  <p class="eyebrow">O que é</p><p class="lead">${s.intro}</p>
  ${s.avisos && s.avisos.length ? `<div style="margin-top:14px">${s.avisos.map(alertHtml).join('')}</div>` : ''}`;

TAB.passos = s => {
  let n = 0;
  const html = s.passos.map(f => `<div class="phase">${f.fase}</div><div class="steps">${f.items.map(it => `
      <div class="step ${it.key ? 'key' : ''}"><span class="n">${++n}</span>
      <span class="tx">${it.t}${it.d ? `<small>${it.d}</small>` : ''}${it.foto ? `<img src="${esc(it.foto)}" alt="" loading="lazy">` : ''}</span></div>`).join('')}</div>`).join('');
  const lacres = s.lacres ? `<div class="phase">Tipos de lacre</div><div class="two">
      <div>🔵<b>Lacre azul</b>Envolve o registro e impede o religamento.</div>
      <div>⚙️<b>Lacre de metal</b>Desconecta o registro da válvula e fecha direto no tubo.</div></div>` : '';
  return html + lacres + `<p style="font-size:12.5px;color:var(--muted);margin-top:12px">Os passos em <b style="color:var(--orange-dark)">laranja</b> são os que mais geram falha.</p>`;
};

TAB.baixa = s => {
  const tree = BAIXA[s.baixa];
  const st = wizardState[s.id] || (wizardState[s.id] = { node: tree.start, path: [] });
  const node = tree.nodes[st.node];
  const trail = st.path.length ? `<div class="wz-trail">${st.path.map(p => `<span>${esc(p)}</span>`).join('')}</div>` : '';
  let inner;
  if (node.q) {
    inner = `${trail}<div class="wz-q">${node.q}</div>${node.help ? `<div class="wz-help">${node.help}</div>` : ''}
      <div class="wz-opts">${node.opts.map((o, k) => `<button class="wz-opt" onclick="wzPick('${s.id}',${k})">${o[0]}</button>`).join('')}</div>`;
  } else {
    const r = node.r;
    inner = `${trail}<div class="wz-result ${r.tone}"><div class="rt">${r.title}</div>
      <ul>${r.items.map(i => `<li class="${r.tone === 'green' ? '' : 'warn'}">${i}</li>`).join('')}</ul></div>
      ${r.link ? `<button class="btn ghost" style="width:100%;margin-top:14px" onclick="go('lesson',{id:'${r.link[0]}'})">${r.link[1]} →</button>` : ''}
      <div class="step-nav" style="margin-top:14px">
        ${r.restart ? `<button class="btn primary" onclick="wzGoto('${s.id}','${r.restart}')">Responder de novo</button>` : ''}
        <button class="btn ${r.restart ? 'ghost' : 'navy'}" onclick="wzReset('${s.id}')">↺ Começar de novo</button>
      </div>`;
  }
  return `<p class="lead" style="margin-bottom:12px">Responda às perguntas e o app mostra <b>como dar a baixa</b> desta OS.</p>
    <div class="wizard">${inner}</div>
    <div class="draft-note">✏️ <b>Rascunho:</b> os nomes exatos das ocorrências no OFS ainda serão confirmados pela gestão.</div>`;
};
function wzPick(id, k) {
  const s = svcById(id), tree = BAIXA[s.baixa], st = wizardState[id];
  const o = tree.nodes[st.node].opts[k];
  st.path.push(o[0]); st.node = o[1]; render();
}
function wzGoto(id, node) { const st = wizardState[id]; st.node = node; st.path.pop(); render(); }
function wzReset(id) { delete wizardState[id]; render(); }

TAB.erros = s => `<p class="lead" style="margin-bottom:12px">Os erros que mais acontecem neste serviço, e o jeito certo de fazer.</p>
  ${s.erros.map(e => `<div class="err"><div class="w">${e.w}</div><div class="r">${e.r}</div></div>`).join('')}`;

TAB.checklist = s => {
  const st = checks[s.id] || [];
  const done = s.checklist.filter((_, i) => st[i]).length;
  let last = '';
  const items = s.checklist.map((c, i) => {
    const head = c[0] !== last ? `<div class="phase">${(last = c[0])}</div>` : '';
    return `${head}<button class="cl-item ${st[i] ? 'on' : ''}" onclick="toggleCheck('${s.id}',${i})" aria-pressed="${!!st[i]}">
      <span class="box">${st[i] ? '✓' : ''}</span><span class="tx"><span>${c[1]}</span>${c[2] ? `<small>${c[2]}</small>` : ''}</span></button>`;
  }).join('');
  return `<div class="cl-top"><span>${done} de ${s.checklist.length} itens</span>
      <button class="chip" onclick="resetCheck('${s.id}')">↺ Limpar</button></div>
    <div class="bar" style="margin-bottom:14px"><i style="width:${Math.round(done / s.checklist.length * 100)}%"></i></div>
    ${items}
    ${done === s.checklist.length ? `<div class="alert green" style="margin-top:10px"><div class="at">🎉 Checklist completo!</div>Tudo conferido neste serviço.</div>` : ''}`;
};
function toggleCheck(id, i) { const a = checks[id] || (checks[id] = []); a[i] = !a[i]; saveChecks(); render(); }
function resetCheck(id) { checks[id] = []; saveChecks(); render(); }

TAB.teste = s => {
  const qs = quizState[s.id] || (quizState[s.id] = { i: 0, score: 0, answered: null });
  if (qs.i >= s.quiz.length) {
    const passed = qs.score === s.quiz.length;
    return `<div class="card score"><div class="big">${qs.score}/${s.quiz.length}</div>
      <p class="lead" style="margin:8px 0 18px">${passed ? '🎉 Parabéns! Você concluiu este serviço no curso.' : 'Quase lá! Revise o passo a passo e tente de novo. Para concluir, é preciso acertar todas.'}</p>
      <div class="step-nav" style="flex-direction:column">
        ${passed ? `<button class="btn primary" onclick="nextCourseItem('${s.id}')">Próxima etapa do curso →</button>` : `<button class="btn primary" onclick="restartQuiz('${s.id}')">Tentar de novo</button>`}
        <button class="btn ghost" onclick="setTab('passos')">Rever o passo a passo</button>
      </div></div>`;
  }
  const q = s.quiz[qs.i];
  const opts = q.o.map((o, k) => {
    let cls = '';
    if (qs.answered !== null) { if (k === q.a) cls = 'right'; else if (k === qs.answered) cls = 'wrong'; }
    return `<button class="q-opt ${cls}" ${qs.answered !== null ? 'disabled' : ''} onclick="answer('${s.id}',${k})">${o}</button>`;
  }).join('');
  const fb = qs.answered === null ? '' : `<div class="q-why ${qs.answered === q.a ? 'ok' : 'no'}"><b>${qs.answered === q.a ? 'Certo!' : 'Não é essa.'}</b> ${q.why}</div>
      <button class="btn primary" style="width:100%;margin-top:14px" onclick="nextQ('${s.id}')">${qs.i + 1 < s.quiz.length ? 'Próxima pergunta →' : 'Ver resultado'}</button>`;
  return `<div class="q-card"><div class="q-count">Pergunta ${qs.i + 1} de ${s.quiz.length}</div>
    <div class="bar" style="margin-top:8px"><i style="width:${Math.round(qs.i / s.quiz.length * 100)}%"></i></div>
    <div class="q-text">${q.q}</div>${opts}${fb}</div>`;
};
function answer(id, k) {
  const s = svcById(id), qs = quizState[id];
  qs.answered = k; if (k === s.quiz[qs.i].a) qs.score++;
  render();
}
function nextQ(id) {
  const s = svcById(id), qs = quizState[id];
  qs.i++; qs.answered = null;
  if (qs.i >= s.quiz.length) {
    const passed = qs.score === s.quiz.length;
    const prev = progress.quiz[id];
    progress.quiz[id] = { score: qs.score, passed: passed || !!(prev && prev.passed), date: new Date().toISOString() };
    saveProgress();
  }
  render();
}
function restartQuiz(id) { delete quizState[id]; render(); }
function nextCourseItem(id) {
  const list = SERVICES.filter(s => s.curso && s.status === 'pronto');
  const nxt = list.find(s => !svcDone(s));
  delete quizState[id];
  if (!fundamentosDone()) go('fundamentos', {}, true);
  else if (nxt) go('svc', { id: nxt.id }, true);
  else goTab('curso');
}

/* ---------- Dúvidas ---------- */
let searchQ = '';
function norm(s) { return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/<[^>]+>/g, ' '); }
function buildIndex() {
  const idx = [];
  FAQ.forEach((f, i) => idx.push({ kind: 'faq', i, title: f.q, sub: f.a[0], text: f.q + ' ' + f.a.join(' '), icon: '💡' }));
  SERVICES.forEach(s => {
    if (s.status !== 'pronto') return;
    idx.push({ kind: 'svc', id: s.id, tab: 'video', title: s.title, sub: s.sub, text: s.title + ' ' + s.sub + ' ' + s.intro, icon: s.icon });
    s.passos.forEach(f => f.items.forEach(it => idx.push({ kind: 'svc', id: s.id, tab: 'passos', title: it.t, sub: s.title + ' · Passo a passo', text: it.t + ' ' + (it.d || ''), icon: s.icon })));
    (s.erros || []).forEach(e => idx.push({ kind: 'svc', id: s.id, tab: 'erros', title: e.r, sub: s.title + ' · Erros comuns', text: e.w + ' ' + e.r, icon: '⚠️' }));
    (s.avisos || []).forEach(a => idx.push({ kind: 'svc', id: s.id, tab: 'video', title: a.title.replace(/^\S+\s/, ''), sub: s.title, text: a.title + ' ' + (a.text || '') + ' ' + (a.items || []).join(' '), icon: s.icon }));
  });
  LESSONS.forEach(l => idx.push({ kind: 'lesson', id: l.id, title: l.title, sub: 'Antes de ir a campo', icon: l.icon,
    text: l.title + ' ' + l.sub + ' ' + l.sections.map(x => (x.text || '') + ' ' + (x.items || []).join(' ') + ' ' + (x.title || '')).join(' ') }));
  idx.forEach(e => e.n = norm(e.text));
  return idx;
}
let INDEX = null;
function openResult(k) {
  const e = INDEX[k];
  if (e.kind === 'faq') go('faq', { i: e.i });
  else if (e.kind === 'svc') go('svc', { id: e.id, tab: e.tab });
  else go('lesson', { id: e.id });
}
function resultsHtml() {
  const words = norm(searchQ).split(/\s+/).filter(w => w.length > 1);
  if (!words.length) return '';
  const hits = INDEX.map((e, k) => ({ e, k, sc: words.reduce((a, w) => a + (e.n.includes(w) ? 1 : 0), 0) }))
    .filter(h => h.sc === words.length).slice(0, 25);
  if (!hits.length) return `<div class="empty"><span class="e">🤔</span>Nada encontrado para "${esc(searchQ)}".<br>Tente outra palavra, como "lacre", "foto" ou "prazo".</div>`;
  return `<div class="list">${hits.map(h => `<button class="row" onclick="openResult(${h.k})"><span class="ri">${h.e.icon}</span>
    <span class="rt"><b>${h.e.title}</b><small>${h.e.sub}</small></span><span class="chev">›</span></button>`).join('')}</div>`;
}
VIEWS.duvidas = () => {
  if (!INDEX) INDEX = buildIndex();
  return { title: 'Tirar dúvidas', html: `
    <div class="search"><span>🔎</span><input id="q" type="search" placeholder="Ex.: lacre, foto, medidor sem placa..." value="${esc(searchQ)}" oninput="searchQ=this.value;document.getElementById('res').innerHTML=resultsHtml()" enterkeyhint="search"></div>
    <div id="res" style="margin-top:12px">${resultsHtml()}</div>
    <p class="eyebrow">Situações comuns em campo</p>
    <div class="chips">${FAQ.map((f, i) => `<button class="chip" onclick="go('faq',{i:${i}})">${f.q}</button>`).join('')}</div>` };
};
VIEWS.faq = r => {
  const f = FAQ[r.i];
  const [kind, id, tab] = f.go;
  const label = kind === 'lesson' ? 'Ver a lição completa' : `Ver em ${svcById(id).title}`;
  return { title: 'Dúvida', html: `
    <div class="faq-a"><h3>${f.q}</h3>
      <div class="alert ${f.tone}" style="margin:0"><ul>${f.a.map(x => `<li>${x}</li>`).join('')}</ul></div></div>
    <button class="btn primary" style="width:100%;margin-top:14px" onclick="${kind === 'lesson' ? `go('lesson',{id:'${id}'})` : `go('svc',{id:'${id}',tab:'${tab}'})`}">${label} →</button>` };
};

/* ---------- Perfil ---------- */
VIEWS.perfil = () => {
  const st = courseStats();
  const ini = profile ? esc(profile.nome.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase()) : '?';
  const res = SERVICES.filter(s => s.quiz).map(s => {
    const q = progress.quiz[s.id];
    return `<div class="row" style="cursor:default"><span class="ri">${s.icon}</span><span class="rt"><b>${s.title}</b>
      <small>${q ? `Melhor resultado: ${q.passed ? s.quiz.length : q.score}/${s.quiz.length}` : 'Teste ainda não feito'}</small></span>
      ${q && q.passed ? '<span class="badge done">✓</span>' : ''}</div>`;
  }).join('');
  return { title: 'Perfil', html: `
    <div class="card" style="padding:16px;display:flex;align-items:center;gap:14px">
      <div style="width:54px;height:54px;border-radius:50%;background:var(--orange);color:#fff;font-family:var(--display);font-weight:900;font-size:19px;display:flex;align-items:center;justify-content:center">${ini}</div>
      <div style="flex:1;min-width:0"><b style="font-size:17px;color:var(--ink);display:block">${profile ? esc(profile.nome) : ''}</b>
      <span style="font-size:13.5px;color:var(--muted)">📍 ${profile ? esc(profile.base) : ''}</span></div>
    </div>
    <p class="eyebrow">Curso: ${st.pct}% concluído</p>
    <div class="list">${res}</div>
    <p class="eyebrow">Conta</p>
    <button class="btn ghost" style="width:100%" onclick="logout()">Trocar de leiturista</button>
    <p style="font-size:12.5px;color:var(--muted);margin-top:12px;line-height:1.5">Seu progresso fica salvo neste celular.</p>` };
};
function logout() {
  if (!confirm('Trocar de leiturista? O progresso deste celular será apagado.')) return;
  try { localStorage.removeItem('user_profile'); localStorage.removeItem('dl_progress'); localStorage.removeItem('dl_checks'); } catch (e) {}
  location.reload();
}

/* =====================================================================
   INÍCIO
   ===================================================================== */
function saveProfile() {
  const nome = document.getElementById('onb-nome').value.trim();
  const base = document.getElementById('onb-base').value.trim();
  if (!nome || !base) { document.getElementById('onb-err').style.display = 'block'; return; }
  profile = { nome, base, since: new Date().toISOString() };
  store.set('user_profile', profile);
  document.getElementById('onboarding').classList.add('hidden');
  render();
}

stack = [{ name: 'home' }];
history.replaceState({ d: 1 }, '');
if (!profile) document.getElementById('onboarding').classList.remove('hidden');
render();

const badge = document.getElementById('offline-badge');
window.addEventListener('online', () => badge.classList.remove('show'));
window.addEventListener('offline', () => badge.classList.add('show'));
if (!navigator.onLine) badge.classList.add('show');

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
